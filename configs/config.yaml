node2vec:
  dimensions: 64
  walk_length: 30
  num_walks: 200
  p: 1.0
  q: 0.5
  window: 10
  min_count: 1
  workers: 4
  seed: 42

classifier:
  type: "xgboost"
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  test_size: 0.2
  random_state: 42

graph:
  num_nodes: 3000
  avg_edges_per_node: 5
  fraud_rate: 0.05
  num_fraud_rings: 15
  ring_size_range: [3, 12]
  weight_range: [1.0, 100.0]

features:
  use_graph_features: true
  use_embeddings: true
  embedding_prefix: "emb_"
